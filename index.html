<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="xzsacbY_qB4AWOtODv8YgVdZTwSiWHR6lw3pWjxnc3s" />
<title>BISTRO - Earn Money Daily</title>
<style>
  *{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
  body{margin:0;background:#0a0a0a;color:#fff} /* Dark theme like BunnyBand */
  .screen{display:none;padding:20px;max-width:420px;margin:auto;min-height:100vh}
  .active{display:block}
  h1{color:#FFD700;text-align:center;font-size:28px}
  h2{color:#00BFFF;text-align:center}
  input, select, button{width:100%;padding:14px;margin:10px 0;border:none;border-radius:10px;font-size:16px}
  button{background:#00BFFF;color:white;font-weight:bold;cursor:pointer}
  button:disabled{background:#555}
  .card{background:#1a1a1a;padding:18px;border-radius:15px;margin:12px 0}
  .balance{font-size:28px;font-weight:bold;color:#00BFFF}
  .task-card{background:#1a1a1a;padding:15px;border-radius:10px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
  .task-card button{background:#FFD700;color:#000;padding:8px 15px}
  .small{font-size:12px;color:#aaa;text-align:center}
  .nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1a1a1a;padding:5px}
  .nav button{flex:1;background:none;color:#aaa;font-size:12px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="screen active">
  <h1>BISTRO</h1>
  <div class="card">
    <input type="tel" id="phone" placeholder="Phone Number">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="signup()" style="background:#FFD700;color:#000">Signup</button>
  </div>
</div>

<!-- HOME -->
<div id="home" class="screen">
  <h1>BISTRO</h1>
  <div class="card">
    <p>Welcome <b id="username">User</b></p>
    <p>Total Balance</p>
    <p class="balance">₦<span id="balance">0</span></p>
    <p class="small">Daily Task: <b id="taskCount">0</b>/20</p>
  </div>
  <button onclick="showScreen('tasks')">Task Center</button>
  <button onclick="copyInvite()" style="background:#FFD700;color:#000">Share</button>
</div>

<!-- TASKS -->
<div id="tasks" class="screen">
  <h2>Task Center</h2>
  <p class="small">Perform tasks and verify to earn</p>
  <div id="taskList"></div>
  <p class="small" id="timerText" style="display:none;">Come back in <span id="countdown">10</span>s to claim</p>
</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">
  <h2>Withdraw</h2>
  <div class="card">
    <p>Progress to Minimum: <span id="progress">0</span>%</p>
  </div>
  <p class="small">Minimum = ₦10,000. Withdrawals: 6am - 6pm WAT</p>
  <select id="bank"><option>Select Bank</option><option>GTBank</option><option>Opay</option></select>
  <input type="text" id="accNum" placeholder="Account Number">
  <input type="text" id="accName" placeholder="Account Name">
  <button onclick="requestWithdraw()">Withdraw Now</button>
</div>

<div class="nav">
  <button onclick="showScreen('home')">Home</button>
  <button onclick="showScreen('tasks')">Task</button>
  <button onclick="showScreen('withdraw')">Withdraw</button>
</div>

<script>
const TASK_REWARD = 20;
const MAX_TASKS = 20;
const MIN_WITHDRAW = 10000;
const ADSTERRA_LINK = "https://pl30556019.effectivecpmnetwork.com/68/be/e5/68bee5d75277abf76b2436a45a10f4b0.js"; // This is your adsterra direct link

let user = JSON.parse(localStorage.getItem('bistroUser')) || {balance:0,tasks:0,loggedIn:false,phone:''};

// Daily Reset
let lastReset = localStorage.getItem('lastReset');
let today = new Date().toDateString();
if(lastReset !== today){ user.tasks=0; localStorage.setItem('lastReset',today); save(); }

function save(){localStorage.setItem('bistroUser',JSON.stringify(user))}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='home') updateHome();
  if(id==='tasks') loadTasks();
}

function login(){
  let phone = document.getElementById('phone').value;
  if(phone===''){alert('Enter phone number');return}
  user.loggedIn=true; user.phone=phone; save();
  showScreen('home');
}
function signup(){ alert('Account created!'); }

function updateHome(){
  document.getElementById('username').innerText = user.phone || 'User';
  document.getElementById('balance').innerText = user.balance;
  document.getElementById('taskCount').innerText = user.tasks;
  document.getElementById('progress').innerText = Math.floor((user.balance/MIN_WITHDRAW)*100);
}

function loadTasks(){
  let list = document.getElementById('taskList');
  list.innerHTML='';
  if(user.tasks >= MAX_TASKS){
    list.innerHTML = '<div class="card"><p>✅ All 20 tasks done. Come back tomorrow!</p></div>';
    return;
  }
  for(let i=1;i<=MAX_TASKS;i++){
    let done = user.tasks >= i;
    list.innerHTML += `
      <div class="task-card">
        <div>
          <b>TASK</b><br>
          <span class="small">Watch advertisement</span><br>
          <b>₦${TASK_REWARD}.00</b>
        </div>
        <button ${done?'disabled':''} onclick="doTask(${i})">${done?'Verify':'Perform Task'}</button>
      </div>
    `;
  }
}

let claimTimeout;
function doTask(taskNum){
  if(user.tasks >= MAX_TASKS) return;
  
  // 1. OPEN ADSTERRA AD IN NEW TAB - THIS IS WHAT MAKES MONEY
  window.open(ADSTERRA_LINK, '_blank');
  
  // 2. SHOW TIMER LIKE BUNNYBAND
  document.getElementById('timerText').style.display='block';
  let seconds = 10;
  document.getElementById('countdown').innerText = seconds;
  
  claimTimeout = setInterval(()=>{
    seconds--;
    document.getElementById('countdown').innerText = seconds;
    if(seconds <= 0){
      clearInterval(claimTimeout);
      // 3. GIVE REWARD
      user.tasks++;
      user.balance += TASK_REWARD;
      save();
      updateHome();
      alert(`+₦${TASK_REWARD} added!`);
      document.getElementById('timerText').style.display='none';
      loadTasks();
    }
  }, 1000);
}

function requestWithdraw(){
  let hour = new Date().getHours() + 1;
  if(hour<6 || hour>=18){alert('Withdrawals only 6am - 6pm WAT');return}
  if(user.balance < MIN_WITHDRAW){alert(`Minimum withdrawal is ₦${MIN_WITHDRAW}`);return}
  alert(`Withdrawal request for ₦${user.balance} submitted!`);
  user.balance = 0; save(); updateHome(); showScreen('home');
}

function copyInvite(){
  navigator.clipboard.writeText('https://arcruise.github.io/Bistro/?ref=' + user.phone);
  alert('Invite link copied!');
}
</script>
</body>
</html>
