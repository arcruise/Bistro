<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="xzsacbY_qB4AWOtODv8YgVdZTwSiWHR6lw3pWjxnc3s" />
<title>BISTRO</title>
<style>
  *{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
  body{margin:0;background:#0B1120;color:#fff}
  .screen{display:none;padding:20px;max-width:420px;margin:auto;min-height:100vh;padding-bottom:80px}
  .active{display:block}
  h1{color:#FFD700;text-align:center;font-size:28px}
  input, button{width:100%;padding:14px;margin:10px 0;border:none;border-radius:10px;font-size:16px}
  button{background:#00BFFF;color:white;font-weight:bold;cursor:pointer}
  button:disabled{background:#555}
  .card{background:#131B2E;padding:18px;border-radius:15px;margin:12px 0}
  .balance{font-size:28px;font-weight:bold;color:#00BFFF}
  .task-card{background:#131B2E;padding:15px;border-radius:12px;margin:10px 0}
  .task-top{display:flex;justify-content:space-between;align-items:center}
  .task-card button{background:#FFD700;color:#000;padding:10px 15px;border-radius:8px;width:auto}
  .small{font-size:12px;color:#aaa;text-align:center}
  .nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#131B2E;padding:8px}
  .nav button{flex:1;background:none;color:#aaa;font-size:12px}
  .timer{color:#FFD700;font-size:18px;text-align:center}
</style>
</head>
<body>

<div id="login" class="screen active">
  <h1>BISTRO</h1>
  <div class="card">
    <input type="tel" id="phone" placeholder="Phone Number">
    <button onclick="login()">Login</button>
  </div>
</div>

<div id="home" class="screen">
  <h1>BISTRO</h1>
  <div class="card">
    <p>Welcome <b id="username">User</b></p>
    <p class="balance">₦<span id="balance">0</span></p>
    <p class="small">Daily Task: <b id="taskCount">0</b>/20</p>
  </div>
  <button onclick="showScreen('tasks')">Task Center</button>
</div>

<div id="tasks" class="screen">
  <h2 style="text-align:center;color:#00BFFF">Task Center</h2>
  <div id="taskList"></div>
  <div id="timerBox" class="card" style="display:none;">
    <p class="small">Task in progress...</p>
    <p class="timer">Wait <span id="countdown">10</span>s to claim</p>
    <p class="small">Do not close the ad page</p>
  </div>
</div>

<div class="nav">
  <button onclick="showScreen('home')">Home</button>
  <button onclick="showScreen('tasks')">Task</button>
</div>

<script>
// ========== YOUR 2 SMARTLINKS ==========
const SMARTLINKS = [
  "https://www.effectivecpmnetwork.com/fgsu8uz4?key=b29b8257cda1793a2dffedf8fea2b14d",
  "https://www.effectivecpmnetwork.com/u3jpa2jqbe?key=3d0c83b9a0fa4789b8823335ac7f42c5"
];
const TASK_REWARD = 20; 
const MAX_TASKS = 20;

let user = JSON.parse(localStorage.getItem('bistroUser')) || {balance:0,tasks:0,phone:''};
let today = new Date().toDateString(); 
if(localStorage.getItem('lastReset') !== today){ 
  user.tasks=0; 
  localStorage.setItem('lastReset',today); 
  save(); 
}

function save(){localStorage.setItem('bistroUser',JSON.stringify(user))}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='home') updateHome();
  if(id==='tasks') loadTasks();
}
function login(){
  user.phone=document.getElementById('phone').value;
  if(user.phone===''){alert('Enter phone number')}else{save();showScreen('home');}
}
function updateHome(){
  document.getElementById('username').innerText = user.phone;
  document.getElementById('balance').innerText = user.balance;
  document.getElementById('taskCount').innerText = user.tasks;
}
function loadTasks(){
  let list = document.getElementById('taskList');
  list.innerHTML='';
  document.getElementById('timerBox').style.display='none';
  if(user.tasks >= MAX_TASKS){
    list.innerHTML = '<div class="card"><p>✅ All 20 tasks done. Come back tomorrow!</p></div>';
    return;
  }
  for(let i=1;i<=MAX_TASKS;i++){
    let done = user.tasks >= i;
    list.innerHTML += `<div class="task-card">
      <div class="task-top">
        <div><b>TASK ${i}</b><br><span class="small">Visit Sponsor</span><br><b>₦${TASK_REWARD}.00</b></div>
        <button ${done?'disabled':''} onclick="doTask(${i})">${done?'Verify':'Perform Task'}</button>
      </div>
    </div>`;
  }
}

// UPDATED FUNCTION - ROTATES BETWEEN 2 LINKS
function doTask(taskNum){
  let linkIndex = (taskNum % 2 === 1)? 0 : 1; // Odd = Link1, Even = Link2
  window.open(SMARTLINKS[linkIndex], '_blank', 'noopener,noreferrer'); // OPENS AD
  
  document.getElementById('timerBox').style.display='block';
  let seconds = 10;
  document.getElementById('countdown').innerText = seconds;
  let timer = setInterval(()=>{
    seconds--;
    document.getElementById('countdown').innerText = seconds;
    if(seconds <= 0){
      clearInterval(timer);
      user.tasks++;
      user.balance += TASK_REWARD;
      save();
      updateHome();
      alert(`+₦${TASK_REWARD} added!`);
      document.getElementById('timerBox').style.display='none';
      loadTasks();
    }
  }, 1000);
}
</script>
</body>
</html>
